openapi: 3.1.0
info:
  title: LedgerCore Policy Decision API
  version: 1.1.0
  summary: Contract between the ledger service (client) and the policy service (server).
  description: |
    The ledger asks the policy service whether a balanced journal may be approved.
    The policy service never sees balances and never writes ledger state.

    **Fail-closed rule.** The ledger treats every outcome other than a schema-valid
    `200` with `decision: APPROVED` as "not approved". Timeouts, 5xx, malformed
    bodies, unknown enum values and mismatched `transactionId` never approve a journal.
    See `docs/adr/ADR-005-versioned-ledger-policy-contract.md`.

    **Versioning.** Major version is in the path (`/v1`). Both sides send
    `contractVersion` in the body; minor/patch changes are additive only.

    **Idempotency (1.0.1).** `transactionId` identifies one decision. A repeated
    request whose decision-relevant fields (`organizationId`, `transactionType`,
    `currency`, `totalAmount` compared numerically, and `accountContext` as an
    unordered set) are identical returns the original decision unchanged: same
    `decisionId`, `policyVersion`, `decision`, `reasonCodes` and `evaluatedAt`.
    `requestedAt`, `requestedBy` and `contractVersion` may differ on a retry. A
    repeated `transactionId` with different decision-relevant fields is `409`
    (`IDEMPOTENCY_CONFLICT`); the original decision stands.

    **Authentication (1.1.0).** Every evaluation request carries the ledger's
    service credential as `Authorization: Bearer <credential>`. A missing or
    invalid credential is `401` (`SERVICE_AUTHENTICATION_REQUIRED`), and nothing
    is evaluated or recorded. The credential is deployment configuration, never
    part of a payload. See ADR-013 for its limits.

    **Changelog.**
    - 1.1.0: documents service authentication (bearer security scheme, `401`).
      Payload schemas are unchanged. Compatibility note: a caller that sends no
      credential now receives `401`. The ledger, the only consumer, sends it
      from this version on.
    - 1.0.1: clarifications only, with no change to validation. Idempotency
      semantics; `policyVersion` is `none` when no policy version could decide;
      reserved reason codes; `409` also covers idempotency conflicts; problem
      bodies carry a machine-readable `code`.
    - 1.0.0: initial contract.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8081
    description: Local policy service
tags:
  - name: decisions
    description: Transaction approval decisions
paths:
  /v1/policy-decisions:
    post:
      tags: [decisions]
      operationId: evaluatePolicyDecision
      summary: Evaluate approval policy for one journal
      security:
        - serviceCredential: []
      description: |
        Synchronous evaluation. The ledger applies a client-side timeout
        (default 2000 ms, `Ledger:PolicyDecisionTimeoutMs`). The server should
        answer well inside that budget; if it cannot evaluate trustworthily it
        must return 503, never a guessed decision.
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Propagated for tracing; echoed back on the response.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy-decision-request.v1.schema.json'
      responses:
        '200':
          description: A decision was made. `APPROVED`, `REJECTED` and `REVIEW_REQUIRED` are all 200.
          headers:
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/policy-decision-response.v1.schema.json'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: |
            `SERVICE_AUTHENTICATION_REQUIRED` (1.1.0): missing or invalid service
            credential. The ledger classifies this as a configuration failure: it
            fails closed and does not retry.
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            `CONTRACT_VERSION_UNSUPPORTED`: `contractVersion` is not 1.x (e.g. a
            future major). The ledger classifies this as contract incompatibility,
            not rejection.

            `IDEMPOTENCY_CONFLICT` (1.0.1): this `transactionId` was already
            decided with different decision-relevant fields. The original decision
            is unchanged; the ledger must not retry with the conflicting body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          description: Policy service cannot produce a trustworthy decision (e.g. policy store unavailable). Ledger fails closed.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    serviceCredential:
      type: http
      scheme: bearer
      description: |
        Shared service credential issued to the ledger (ADR-013). Opaque, at least
        32 characters, supplied through environment configuration.
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable error code (1.0.1), e.g. `VALIDATION_FAILED`,
            `REQUEST_INVALID`, `CONTRACT_VERSION_UNSUPPORTED`, `IDEMPOTENCY_CONFLICT`,
            `POLICY_EVALUATION_UNAVAILABLE`.
