name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ledger-api:
    name: ledger-api (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ledger-api
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: services/ledger-api/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('services/ledger-api/**/*.csproj', 'services/ledger-api/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # Integration tests start PostgreSQL 18.6 through Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      # Explicit paths only: test results, never the workspace (no .env, no secrets).
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ledger-api-test-results
          path: services/ledger-api/tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  policy-service:
    name: policy-service (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/policy-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/policy-service/pom.xml
      - name: Resolve dependencies
        run: ./mvnw -B -ntp dependency:go-offline
      - name: Format check
        run: ./mvnw -B -ntp spotless:check
      # Integration and contract tests start PostgreSQL 18.6 through Testcontainers (Docker is available on ubuntu-latest).
      - name: Compile and test
        run: ./mvnw -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: policy-service-test-reports
          path: |
            services/policy-service/target/surefire-reports/
            services/policy-service/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate OpenAPI, schemas and examples
        run: ./contracts/validate.sh

  database-isolation:
    name: database isolation (roles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start PostgreSQL only
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120 postgres
      - name: Verify database isolation
        run: ./infra/docker/postgres/verify-isolation.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Tear down
        if: always()
        run: docker compose down -v

  integration:
    name: integration (ledger + policy + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ledger-api, policy-service, contracts]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: tests/integration/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-integration-${{ runner.os }}-${{ hashFiles('tests/integration/**/*.csproj') }}
          restore-keys: nuget-integration-${{ runner.os }}-
      # Testcontainers builds both service images from their Dockerfiles, starts PostgreSQL with the
      # repository init script, and puts Toxiproxy between the ledger and the policy service.
      - name: Multi-service tests
        working-directory: tests/integration
        run: dotnet test --logger "console;verbosity=normal" --logger "trx;LogFileName=integration.trx"
      - name: Compose smoke test
        run: |
          cp .env.example .env
          ./tests/integration/compose-smoke.sh --build
      # Diagnostics go to a dedicated directory; .env and the workspace are never uploaded.
      # Service logs contain no credentials (checked by SecretRedactionTests and the multi-service suite).
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          docker compose ps --all > diagnostics/compose-ps.txt 2>&1 || true
          for c in $(docker compose ps --all --quiet 2>/dev/null); do
            docker inspect --format '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{json .State.Health.Log}}{{end}}' "$c" >> diagnostics/container-health.txt 2>&1 || true
          done
          for s in postgres ledger-migrate policy-service ledger-api; do
            docker compose logs --no-color "$s" > "diagnostics/$s.log" 2>&1 || true
          done
          cat diagnostics/compose-ps.txt diagnostics/container-health.txt || true
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: integration-diagnostics
          path: |
            diagnostics/
            tests/integration/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
