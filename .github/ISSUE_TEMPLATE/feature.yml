name: Feature
description: A new capability with clear acceptance criteria.
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today, and who is affected?
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope, and explicitly what is not.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions. Include any financial invariant this must preserve.
      placeholder: |
        - [ ] ...
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues, ADRs or contract versions this depends on.
      placeholder: "Depends on #..., ADR-00X"
    validations: { required: true }
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: Unit, integration or contract tests that will prove the acceptance criteria.
    validations: { required: true }
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: Acceptance criteria met and covered by automated tests
        - label: CI green
        - label: Contract and ADRs updated if behaviour at a boundary changed
        - label: Reviewed and approved by a contributor other than the author
        - label: No secrets, balances or PII added to logs or contracts
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ledger, policy, contracts, database, integration, devops]
    validations: { required: true }
