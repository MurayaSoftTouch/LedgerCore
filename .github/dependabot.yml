# Weekly, grouped updates to keep noise low. Major versions arrive as separate PRs.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/services/ledger-api", "/tests/integration"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /services/policy-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
