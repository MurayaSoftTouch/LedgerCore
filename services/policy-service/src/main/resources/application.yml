spring:
  application:
    name: policy-service
  # The dedicated `policy` database (ADR-003); this service has no access to the ledger database.
  # Runtime queries use the least-privilege policy_runtime role; only Flyway uses the schema owner.
  # No password defaults are committed: set POLICY_RUNTIME_DB_PASSWORD and POLICY_DB_PASSWORD.
  datasource:
    url: ${POLICY_DB_URL:jdbc:postgresql://localhost:5432/policy}
    username: ${POLICY_DB_RUNTIME_USERNAME:policy_runtime}
    password: ${POLICY_RUNTIME_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${POLICY_DB_POOL_SIZE:10}
  # Forward-only, versioned migrations (db/migration) as the schema owner, over its own connection.
  # There is no ORM and no schema generation.
  flyway:
    user: ${POLICY_DB_MIGRATION_USERNAME:policy_app}
    password: ${POLICY_DB_PASSWORD:}
    clean-disabled: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

ledgercore:
  policy:
    contract-version: 1.1.0
    environment: ${LEDGERCORE_ENVIRONMENT:local}
    # Shared service credentials (ADR-013), from the environment only. The decision token is
    # required; without an admin token the management API is disabled.
    auth:
      decision-token: ${POLICY_DECISION_API_TOKEN:}
      admin-token: ${POLICY_ADMIN_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,policySchema
  info:
    env:
      enabled: true

info:
  service: policy-service
  contract-version: ${ledgercore.policy.contract-version}

springdoc:
  api-docs:
    path: /openapi/v3/api-docs
  swagger-ui:
    path: /openapi/swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
